[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Astro content-hashes /_astro/* filenames, so contents never change for a
# given URL — cache forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# .frag filenames are stable (not content-hashed), so cache for a day and
# revalidate. If the model is re-converted, returning visitors pick it up
# within 24h without a hard refresh.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
